name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint, test, and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      - name: Ensure rustup components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: "src-tauri -> target"
          shared-key: lint

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Install cargo-audit
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0007 \
            --ignore RUSTSEC-2025-0024 \
            --ignore RUSTSEC-2024-0421 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0194

      - name: Install cargo-deny
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-deny

      - name: cargo deny
        working-directory: src-tauri
        run: cargo deny check

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: frontend build
        run: npm run generate

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Tauri build (${{ matrix.platform }})
    needs: lint-and-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - name: Ensure rustup components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: "src-tauri -> target"
          shared-key: build-${{ matrix.platform }}

      - name: npm ci
        run: npm ci

      - name: tauri build
        run: npx tauri build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tauri-bundle-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          retention-days: 14
